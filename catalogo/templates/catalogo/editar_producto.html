{% extends 'catalogo/base.html' %}

{% block title %}Editar {{ producto.nombre }} | FerroSur{% endblock %}

{% block content %}
<a class="back-link" href="{% url 'catalogo:lista' %}">&larr; Volver al catálogo</a>
<section class="manage-products edit-product" aria-labelledby="edit-product-heading">
    <p class="eyebrow">GESTIÓN DEL CATÁLOGO</p>
    <h1 id="edit-product-heading">Editar producto</h1>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {% include 'catalogo/_producto_form_fields.html' %}
        <div class="form-actions">
            <button type="submit" class="primary-button">Guardar cambios</button>
            <a class="secondary-button" href="{% url 'catalogo:lista' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
