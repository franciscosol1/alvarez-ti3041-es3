{% for field in form %}
    <div class="field-row">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
    </div>
{% endfor %}
{% for error in form.non_field_errors %}<p class="form-error">{{ error }}</p>{% endfor %}
